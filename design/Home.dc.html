<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #D97757; } a:hover { color: #C2703F; }
    .lbl { font-size: 14px; letter-spacing: 1px; }
  </style>
</helmet>

<div style="width: 800px; height: 480px; display: flex; flex-direction: column; font-family: Montserrat, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden;">

  <div style="height: 66px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: {{c.surface}};">
    <div style="flex-grow: 1; font-size: 28px; font-weight: 500; color: {{c.text}};">Office</div>
    <div style="width: 260px; text-align: right; font-size: 14px; color: {{c.muted}};">connected</div>
    <div style="width: 12px; height: 12px; border-radius: 50%; background: #7D9A6B; flex: none;"></div>
  </div>
  <div style="height: 1px; flex: none; background: {{c.line}};"></div>

  <div style="flex-grow: 1; display: flex; gap: 24px; padding: 18px;">

    <div style="width: 50%; display: flex; flex-direction: column; gap: 6px; padding: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="lbl" style="flex-grow: 1; color: {{c.muted}};">THERMOSTAT</div>
        <div style="font-size: 14px; color: {{c.muted}};">Office</div>
      </div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 48px; font-weight: 500; color: {{c.text}};">21&deg;</div>
        <div style="font-size: 14px; color: {{c.muted}};">current</div>
        <div style="height: 8px;"></div>
        <div style="font-size: 14px; color: {{c.muted}};">target</div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <div style="width: 64px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; color: {{c.text}};">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="11" width="16" height="2.4" rx="1.2"/></svg>
          </div>
          <div style="flex-grow: 1; text-align: center; font-size: 48px; font-weight: 500; color: {{c.text}};">22&deg;</div>
          <div style="width: 64px; height: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; color: {{c.text}};">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.8 4h2.4v16h-2.4z"/><path d="M4 10.8h16v2.4H4z"/></svg>
          </div>
        </div>
      </div>
      <div style="font-size: 14px; color: {{c.muted}};">heat&nbsp;&nbsp;-&nbsp;&nbsp;heating</div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; padding: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 12px;">
      <div class="lbl" style="color: {{c.muted}};">OFFICE LIGHTS</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px;">

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="flex-grow: 1; font-size: 14px; color: {{c.text}};">Desk Lamp</div>
            <div style="width: 56px; height: 28px; flex: none; border-radius: 14px; background: {{accent}}; position: relative;">
              <div style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></div>
            </div>
          </div>
          <div style="width: 100%; height: 10px; border-radius: 5px; background: {{c.line}}; overflow: hidden;">
            <div style="width: 92%; height: 100%; border-radius: 5px; background: {{accent}};"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="flex-grow: 1; font-size: 14px; color: {{c.text}};">Shelf Strip</div>
            <div style="width: 56px; height: 28px; flex: none; border-radius: 14px; background: {{c.line}}; position: relative;">
              <div style="position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></div>
            </div>
          </div>
          <div style="width: 100%; height: 10px; border-radius: 5px; background: {{c.line}}; overflow: hidden;">
            <div style="width: 0%; height: 100%; border-radius: 5px; background: {{accent}};"></div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="flex-grow: 1; font-size: 14px; color: {{c.text}};">Ceiling</div>
            <div style="width: 56px; height: 28px; flex: none; border-radius: 14px; background: {{accent}}; position: relative;">
              <div style="position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></div>
            </div>
          </div>
          <div style="width: 100%; height: 10px; border-radius: 5px; background: {{c.line}}; overflow: hidden;">
            <div style="width: 45%; height: 100%; border-radius: 5px; background: {{accent}};"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div style="height: 26px; flex: none; display: flex; justify-content: center; align-items: center; gap: 10px;">
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{c.line}};"></div>
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}};"></div>
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{c.line}};"></div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"accent":{"editor":"color","default":"#D97757","options":["#D97757","#B49FD8","#6A9BCC","#7D9A6B"],"section":"Theme"},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    // Exact values from ui/ui.c palettes_init().
    const c = dark
      ? { bg: '#1F1E1D', surface: '#262624', line: '#3A3A37', text: '#F0EEE6', muted: '#8A8780' }
      : { bg: '#F0EEE6', surface: '#FAF9F5', line: '#D9D6CC', text: '#191919', muted: '#6E6B62' };
    return { c, accent: this.props.accent ?? '#D97757' };
  }
}
</script>
</body>
</html>
