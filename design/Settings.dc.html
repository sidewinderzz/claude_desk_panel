<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    a { color: #D97757; } a:hover { color: #C2703F; }
    .lbl { font-size: 14px; letter-spacing: 1px; }
    .row { display: flex; align-items: center; gap: 8px; }
    .rowlbl { flex-grow: 1; font-size: 14px; }
  </style>
</helmet>

<div style="width: 800px; height: 480px; display: flex; flex-direction: column; font-family: Montserrat, system-ui, sans-serif; background: {{c.bg}}; color: {{c.text}}; overflow: hidden;">

  <div style="height: 66px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: {{c.surface}};">
    <div style="flex-grow: 1; font-size: 28px; font-weight: 500; color: {{c.text}};">Settings</div>
    <div style="width: 260px; text-align: right; font-size: 14px; color: {{c.muted}};">connected</div>
    <div style="width: 12px; height: 12px; border-radius: 50%; background: #7D9A6B; flex: none;"></div>
  </div>
  <div style="height: 1px; flex: none; background: {{c.line}};"></div>

  <div style="flex-grow: 1; display: flex; gap: 24px; padding: 18px;">

    <div style="width: 50%; display: flex; flex-direction: column; gap: 14px; padding: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 12px;">
      <div class="lbl" style="color: {{c.muted}};">DISPLAY</div>

      <div class="row">
        <div class="rowlbl" style="color: {{c.text}};">Dark mode</div>
        <div style="width: 56px; height: 28px; flex: none; border-radius: 14px; background: {{sw.bg}}; position: relative;">
          <div style="position: absolute; top: 3px; {{sw.side}}: 3px; width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF;"></div>
        </div>
      </div>

      <div class="row">
        <div class="rowlbl" style="color: {{c.text}};">Dim screen</div>
        <div style="width: 180px; height: 10px; flex: none; border-radius: 5px; background: {{c.line}}; position: relative;">
          <div style="width: 18%; height: 100%; border-radius: 5px; background: {{accent}};"></div>
          <div style="position: absolute; top: -5px; left: 18%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: {{accent}};"></div>
        </div>
      </div>

      <div class="row">
        <div class="rowlbl" style="color: {{c.text}};">Screen off after</div>
        <div style="width: 170px; height: 40px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 8px; font-size: 14px; color: {{c.text}};">
          <span>15 minutes</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 16 5 8h14l-7 8z"/></svg>
        </div>
      </div>

      <div style="font-size: 14px; line-height: 1.45; color: {{c.muted}}; text-wrap: pretty;">Backlight on this board is on/off only, so dim is done in software. Tap the screen to wake.</div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px; background: {{c.surface}}; border: 1px solid {{c.line}}; border-radius: 12px;">
      <div class="lbl" style="color: {{c.muted}};">NETWORK</div>

      <div style="width: 100%; height: 48px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{accent}}; color: #1F1E1D; font-size: 14px; font-weight: 500;">Wi-Fi setup</div>

      <div style="width: 100%; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.text}}; font-size: 14px;">Refresh now</div>

      <div style="font-size: 14px; line-height: 1.5; color: {{c.muted}};">
        YOUR-WIFI<br>DEVICE-IP<br><br>bridge&nbsp;&nbsp;http://YOUR-PC-IP:8787/usage<br>firmware&nbsp;&nbsp;v0.5
      </div>
    </div>
  </div>

  <div style="height: 26px; flex: none; display: flex; justify-content: center; align-items: center; gap: 10px;">
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{c.line}};"></div>
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{c.line}};"></div>
    <div style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}};"></div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true,"section":"Theme"},"accent":{"editor":"color","default":"#D97757","options":["#D97757","#B49FD8","#6A9BCC","#7D9A6B"],"section":"Theme"},"$preview":{"width":800,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    // Exact values from ui/ui.c palettes_init().
    const c = dark
      ? { bg: '#1F1E1D', surface: '#262624', line: '#3A3A37', text: '#F0EEE6', muted: '#8A8780' }
      : { bg: '#F0EEE6', surface: '#FAF9F5', line: '#D9D6CC', text: '#191919', muted: '#6E6B62' };
    const accent = this.props.accent ?? '#D97757';
    // The dark-mode switch shows the state of the tweak it controls.
    const sw = dark ? { bg: accent, side: 'right' } : { bg: c.line, side: 'left' };
    return { c, accent, sw };
  }
}
</script>
</body>
</html>
